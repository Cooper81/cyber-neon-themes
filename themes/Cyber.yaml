# Cyber – Cyberpunk-HUD-Design für Home Assistant
# Abgeschrägte Ecken, Scanlines, laufender Scan-Balken, Orbitron-Schrift, Raster-Hintergrund.
# Bereiche (Sections) werden automatisch bunt: Cyan / Pink / Gelb / Violett (siehe unten).
# Benötigt: card-mod (HACS, als frontend: extra_module_url geladen)
#           + Dashboard-Ressource Google Fonts (Orbitron / Share Tech Mono).
# Farben unten unter "Farben" ändern.

Cyber:
  card-mod-theme: Cyber

  # ---------- Farben ----------
  # Reihenfolge der Bereichsfarben (RGB ohne Klammern)
  cyber-color-1: '0, 255, 234'      # Cyan
  cyber-color-2: '255, 0, 170'      # Pink
  cyber-color-3: '252, 238, 10'     # Gelb
  cyber-color-4: '180, 0, 255'      # Violett
  # Standardfarbe für Karten außerhalb von Bereichen (z. B. Popups) und in Safari/iOS/Firefox
  cyber-accent-rgb: '0, 255, 234'
  # Glitch-Schatten der Seitentitel
  cyber-accent2-rgb: '255, 0, 170'
  cyber-accent3-rgb: '252, 238, 10'

  # ---------- Grundfarben ----------
  primary-color: 'rgb(0, 255, 234)'
  accent-color: 'rgb(255, 0, 170)'
  dark-primary-color: 'rgb(0, 200, 184)'
  light-primary-color: 'rgb(128, 255, 245)'
  primary-text-color: '#eef3ff'
  secondary-text-color: 'rgba(215, 225, 255, 0.82)'
  text-primary-color: '#eef3ff'
  disabled-text-color: 'rgba(215, 225, 255, 0.45)'
  divider-color: 'rgba(0, 255, 234, 0.25)'
  state-icon-color: 'rgb(0, 255, 234)'
  state-active-color: 'rgb(252, 238, 10)'
  primary-background-color: '#05010f'
  secondary-background-color: '#0c0420'
  card-background-color: '#0c0420'
  app-header-background-color: 'rgba(5, 1, 15, 0.85)'
  app-header-text-color: 'rgb(0, 255, 234)'
  sidebar-background-color: '#07021a'
  sidebar-text-color: 'rgba(215, 225, 255, 0.82)'
  sidebar-icon-color: 'rgba(0, 255, 234, 0.75)'
  sidebar-selected-icon-color: 'rgb(255, 0, 170)'
  sidebar-selected-text-color: 'rgb(255, 0, 170)'
  switch-checked-color: 'rgb(0, 255, 234)'
  scrollbar-thumb-color: 'rgba(0, 255, 234, 0.35)'

  # Hintergrund: Neon-Raster mit Pink/Cyan-Leuchten
  lovelace-background: 'linear-gradient(rgba(0,255,234,0.07) 1px, transparent 1px) 0 0 / 42px 42px fixed, linear-gradient(90deg, rgba(255,0,170,0.07) 1px, transparent 1px) 0 0 / 42px 42px fixed, radial-gradient(ellipse at 50% 115%, rgba(255,0,170,0.38), transparent 60%) fixed, radial-gradient(ellipse at 50% -15%, rgba(0,255,234,0.28), transparent 55%) fixed, #05010f'

  # ---------- Karten (native Variablen, Fallback) ----------
  ha-card-background: 'repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px), linear-gradient(135deg, rgba(12,4,32,0.92), rgba(28,0,48,0.85))'
  ha-card-border-radius: '0px'
  ha-card-border-width: '1px'
  ha-card-border-color: 'rgba(0, 255, 234, 0.95)'
  ha-card-box-shadow: 'inset 0 0 22px rgba(0,255,234,0.28), inset 0 0 2px rgba(0,255,234,0.9)'

  # ---------- Bereichsfarben ----------
  # Automatisch: Bereich 1, 2, 3, 4 (Sections) bzw. Spalte 1–4 (Masonry)
  # bekommen nacheinander cyber-color-1 … 4, danach beginnt es von vorn.
  # (Chrome/Edge/Android-App. Safari/iOS/Firefox: alle Karten in cyber-accent-rgb.)
  # Einzelne Karte umfärben (gilt in allen Browsern):
  #   card_mod:
  #     style: "ha-card { --cyber-sec-rgb: 40, 120, 255; }"

  # ---------- Karten (card-mod) ----------
  card-mod-card: |
    /* Automatische Bereichsfarben: Bereiche (Sections) und Spalten (Masonry) */
    :host-context(.section:nth-child(4n+1)), :host-context(.column:nth-child(4n+1)) { --cyber-sec-rgb: var(--cyber-color-1); }
    :host-context(.section:nth-child(4n+2)), :host-context(.column:nth-child(4n+2)) { --cyber-sec-rgb: var(--cyber-color-2); }
    :host-context(.section:nth-child(4n+3)), :host-context(.column:nth-child(4n+3)) { --cyber-sec-rgb: var(--cyber-color-3); }
    :host-context(.section:nth-child(4n+4)), :host-context(.column:nth-child(4n+4)) { --cyber-sec-rgb: var(--cyber-color-4); }
    ha-card {
      --cy: var(--cyber-sec-rgb, var(--cyber-accent-rgb));
      /* auch innere Elemente (z. B. Mushroom-Chips) bekommen die Bereichsfarbe */
      --ha-card-border-color: rgba(var(--cy), 0.95);
      --ha-card-box-shadow: inset 0 0 22px rgba(var(--cy), 0.28), inset 0 0 2px rgba(var(--cy), 0.9);
      border-color: rgba(var(--cy), 0.95);
      box-shadow: inset 0 0 22px rgba(var(--cy), 0.28), inset 0 0 2px rgba(var(--cy), 0.9);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      font-family: Orbitron, "Share Tech Mono", monospace;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      backdrop-filter: none;
    }
    /* Scan-Balken: bleibt immer innerhalb der Karte (left 0 / right 0),
       nur der Lichtpunkt wandert per background-position */
    ha-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background-image: linear-gradient(90deg, transparent, rgb(var(--cy)), transparent);
      background-size: 45% 100%;
      background-repeat: no-repeat;
      background-position: -82% 0;
      animation: cyberscan 3.5s linear infinite;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes cyberscan { from { background-position: -82% 0; } to { background-position: 182% 0; } }

    /* Überschriften (Heading-Karte) in der Bereichsfarbe */
    :host(hui-heading-card) ha-card {
      --primary-text-color: rgb(var(--cy));
      --secondary-text-color: rgba(var(--cy), 0.75);
      background: none;
      box-shadow: none;
      border: none;
      border-bottom: 1px solid rgba(var(--cy), 0.6);
      clip-path: none;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 4px rgb(var(--cy)), 0 0 14px rgba(var(--cy), 0.6);
    }
    /* Text-Karten (z. B. Seitentitel) ohne Kasten, mit Glitch-Schatten */
    ha-card.text-only,
    :host(.text-only) ha-card {
      background: none;
      box-shadow: none;
      border: none;
      clip-path: none;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 2px 0 rgba(var(--cyber-accent2-rgb), 0.9), -2px 0 rgba(var(--cyber-accent-rgb), 0.9), 0 0 18px rgba(var(--cyber-accent3-rgb), 0.5);
    }
    :host(hui-heading-card) ha-card::after,
    ha-card.text-only::after,
    :host(.text-only) ha-card::after {
      content: none;
    }

  modes:
    dark:
      app-theme-color: '#05010f'
